name: Build Kinovea

on:
  push:
    branches: [ "master", "swim-stable", "swim-v2" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      reel_preview:
        description: 'Preview images of the technical view (reel) with fictional races, as notice annotations'
        type: boolean
        default: false

env:
  VERSION: 2025.2.0

jobs:
  build:
    runs-on: windows-latest
    # contents: write for the draft release of the portable zip (the deployment to the analysts' computers).
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Kinovea.VS2019.sln

    - name: Build Solution
      run: msbuild Kinovea.VS2019.sln /p:Platform="x64" /p:Configuration=Release /p:AllowedReferenceRelatedFileExtensions=none "/flp:logfile=msbuild.log;verbosity=minimal"

    # The compiler errors as one annotation (readable with the GitHub API when the logs are not reachable).
    - name: Report build errors
      if: failure()
      shell: pwsh
      run: |
        if (Test-Path msbuild.log) {
          $first = @{}; $count = @{}; $keys = New-Object System.Collections.Generic.List[string]
          foreach ($m in Select-String -Path msbuild.log -Pattern ': error ') {
            $line = ($m.Line -replace '\s*\[[^\]]*\.csproj\]', '').Trim()
            $line = $line -replace '^.*\\Kinovea\\Kinovea\\', ''
            $key = $line -replace '\(\d+,\d+\)', ''
            if ($first.ContainsKey($key)) { $count[$key] = $count[$key] + 1 } else { $first[$key] = $line; $count[$key] = 1; $keys.Add($key) }
          }
          $chunk = ''; $n = 1
          foreach ($k in $keys) {
            $l = $first[$k]
            if ($count[$k] -gt 1) { $l = $l + ' (x' + $count[$k] + ')' }
            if ($chunk.Length + $l.Length + 1 -gt 3800 -and $chunk.Length -gt 0) {
              Write-Output ('::error title=Build errors ' + $n + '::' + $chunk.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A'))
              $n++; $chunk = ''
              if ($n -gt 10) { break }
            }
            $chunk = $chunk + $l + "`n"
          }
          if ($chunk.Length -gt 0 -and $n -le 10) { Write-Output ('::error title=Build errors ' + $n + '::' + $chunk.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')) }
        }

    - name: Create Portable AppData Folder
      shell: cmd
      run: mkdir Kinovea\bin\x64\Release\AppData
        
    - name: Upload Portable
      id: upload-portable
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Portable-${{env.VERSION}}
        path: Kinovea/bin/x64/Release/

    # The same files as one ordinary zip that Windows opens with a double click (Windows Explorer shows
    # the zips made by upload-artifact as empty), uploaded as it is (not zipped again).
    - name: Zip Portable for Windows
      continue-on-error: true
      shell: pwsh
      run: |
        $zip = "Kinovea-Swim-Portable-$env:VERSION.zip"
        $src = "Kinovea\bin\x64\Release"
        $seven = Get-Command 7z -ErrorAction SilentlyContinue
        if (-not $seven -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) { $seven = "C:\Program Files\7-Zip\7z.exe" }
        if ($seven) {
          & $seven a -tzip -mx=7 $zip "$src\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
        } else {
          Compress-Archive -Path "$src\*" -DestinationPath $zip
        }
        Get-Item $zip | Format-List Name, Length

    - name: Upload Portable zip for Windows
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        path: Kinovea-Swim-Portable-${{env.VERSION}}.zip
        archive: false

    # The same zip as the asset of a draft release of the branch (drafts are not public): the update of the analysts'
    # computers takes it from there, where the storage of the artifacts cannot be reached. Never fails the run.
    - name: Portable zip as a draft release asset
      if: github.event_name == 'push' && (github.ref_name == 'swim-stable' || github.ref_name == 'swim-v2')
      continue-on-error: true
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $zip = "Kinovea-Swim-Portable-$env:VERSION.zip"
        if (-not (Test-Path $zip)) { Write-Output "::warning title=Draft release::no $zip"; exit 0 }
        $tag = "build-${{ github.ref_name }}"
        $notes = "Portable build of ${{ github.ref_name }} at ${{ github.sha }}"
        $api = "https://api.github.com/repos/${{ github.repository }}"
        $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
        try {
          $list = Invoke-RestMethod "$api/releases?per_page=100" -Headers $headers
          $release = $list | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) {
            $body = @{ tag_name = $tag; target_commitish = "${{ github.sha }}"; name = $tag; body = $notes; draft = $true } | ConvertTo-Json
            $release = Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          } else {
            # The tag again: a draft updated without it loses it ("untagged-…").
            $body = @{ tag_name = $tag; target_commitish = "${{ github.sha }}"; body = $notes } | ConvertTo-Json
            $release = Invoke-RestMethod "$api/releases/$($release.id)" -Method Patch -Headers $headers -Body $body -ContentType "application/json"
          }
          foreach ($asset in @($release.assets)) {
            if ($asset -and $asset.name -eq $zip) { Invoke-RestMethod "$api/releases/assets/$($asset.id)" -Method Delete -Headers $headers | Out-Null }
          }
          $upload = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=$zip"
          $asset = Invoke-RestMethod $upload -Method Post -Headers $headers -InFile $zip -ContentType "application/zip"
          Write-Output "::notice title=Draft release::$tag $($asset.name) $($asset.size) bytes"
        } catch {
          $detail = $_.ErrorDetails.Message
          Write-Output "::warning title=Draft release::$($_.Exception.Message) $detail"
          exit 1
        }

    - name: Remove Portable AppData Folder
      shell: cmd
      run: rmdir Kinovea\bin\x64\Release\AppData
    
    # The installer is optional: a failed NSIS download must not fail the portable build.
    - name: Install NSIS
      id: install-nsis
      continue-on-error: true
      uses: repolevedavaj/install-nsis@v1.2.0
      with:
        nsis-version: '3.11'
        
    - name: Make Installer
      if: steps.install-nsis.outcome == 'success'
      shell: cmd
      run: makensis Installer\Kinovea.nsi
      
    - name: Upload Installer
      if: steps.install-nsis.outcome == 'success'
      id: upload-installer
      uses: actions/upload-artifact@v6
      with:
        name: Kinovea-Installer-${{env.VERSION}}
        path: Installer/Kinovea-${{env.VERSION}}.exe

  # Preview images of the technical view (reel) with two fictional races, drawn by the program just built. Only in manual
  # runs with reel_preview: small JPEG images as notice annotations (base64 in parts, read with the GitHub API where the
  # logs and the artifacts are not reachable). At most 10 annotations of a kind in a step and 50 in a job. Never fails the run.
  reel-preview:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reel_preview }}
    runs-on: windows-latest
    continue-on-error: true
    # contents: write for the zip of the images on the draft release of the branch.
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: SwimAnalysis/tests/reel_preview

    - name: Download Portable
      uses: actions/download-artifact@v8
      with:
        name: Kinovea-Portable-${{env.VERSION}}
        path: portable

    - name: Draw the images
      continue-on-error: true
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode render -Bin portable -Out reel-preview

    # All the images in one zip on the draft release "build-<branch>" (faster to read than the annotations below).
    - name: Images as a draft release asset
      if: always() && matrix.part == 0
      continue-on-error: true
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if (-not (Test-Path reel-preview)) { Write-Output "::warning title=Reel preview zip::no images"; exit 0 }
        Compress-Archive -Path reel-preview\* -DestinationPath reel-preview.zip -Force
        $tag = "build-${{ github.ref_name }}"
        $api = "https://api.github.com/repos/${{ github.repository }}"
        $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
        try {
          $list = Invoke-RestMethod "$api/releases?per_page=100" -Headers $headers
          $release = $list | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) {
            $body = @{ tag_name = $tag; target_commitish = "${{ github.sha }}"; name = $tag; body = "Builds of ${{ github.ref_name }}"; draft = $true } | ConvertTo-Json
            $release = Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          }
          $name = "reel-preview-${{ github.run_id }}.zip"
          $upload = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($release.id)/assets?name=$name"
          $asset = Invoke-RestMethod $upload -Method Post -Headers $headers -InFile reel-preview.zip -ContentType "application/zip"
          Write-Output "::notice title=Reel preview zip::$name $($asset.size) bytes"
        } catch {
          Write-Output "::warning title=Reel preview zip::$($_.Exception.Message) $($_.ErrorDetails.Message)"
        }

    - name: Images 1
      if: always()
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode emit -Out reel-preview -Part ${{ matrix.part }} -Parts 6 -First 0 -Count 10

    - name: Images 2
      if: always()
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode emit -Out reel-preview -Part ${{ matrix.part }} -Parts 6 -First 10 -Count 10

    - name: Images 3
      if: always()
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode emit -Out reel-preview -Part ${{ matrix.part }} -Parts 6 -First 20 -Count 10

    - name: Images 4
      if: always()
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode emit -Out reel-preview -Part ${{ matrix.part }} -Parts 6 -First 30 -Count 10

    - name: Images 5
      if: always()
      shell: powershell
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        .\SwimAnalysis\tests\reel_preview\reel_preview.ps1 -Mode emit -Out reel-preview -Part ${{ matrix.part }} -Parts 6 -First 40 -Count 9
